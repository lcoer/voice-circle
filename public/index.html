<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>声圈 VoiceCircle · 语音厅行业社区</title>
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%237c5cff'/><text y='68' x='50' text-anchor='middle' font-size='56' fill='white'>声</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/">
      <div class="logo-box">声圈</div>
      <div>
        <div class="brand-name">声圈</div>
        <div class="brand-sub">VOICE CIRCLE</div>
      </div>
    </a>
    <div class="topbar-search">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      </span>
      <input class="input" id="global-search" placeholder="搜索帖子、平台、岗位">
    </div>
    <div class="topbar-actions" id="topbar-user"></div>
  </div>
  <div class="mobile-search" style="display:none">
    <input class="input" id="mobile-search" placeholder="搜索帖子、平台、岗位">
  </div>
</header>

<div class="layout">
  <aside class="sidenav" id="sidenav"></aside>
  <main id="app">
    <div class="skeleton" style="height:120px"></div>
    <div style="height:12px"></div>
    <div class="skeleton" style="height:120px"></div>
  </main>
  <aside class="rail" id="rail"></aside>
</div>

<nav class="bottombar">
  <div class="bottombar-inner">
    <a class="bottombar-item" href="#/" data-nav="/">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      首页
    </a>
    <a class="bottombar-item" href="#/platforms" data-nav="/platforms">

      平台
    </a>
    <a class="bottombar-item" href="#/community" data-nav="/community">

      招聘

    <a class="bottombar-item" href="#/me" data-nav="/me">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      我的
    </a>
  </div>
</nav>

<script type="module" src="/assets/js/app.js"></script>
